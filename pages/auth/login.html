<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to HostelHub to browse, save favorites, and connect with verified landlords." />
  <title>Welcome Back — HostelHub</title>

  <!-- Shared stylesheets -->
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />

  <!-- Page-specific styling -->
  <link rel="stylesheet" href="../../css/auth.css" />
</head>
<body>

  <main class="auth-page">
    
    <!-- LEFT PANEL: Brand Image and Overlaid Marketing Banner -->
    <section class="auth-left" aria-label="Hostel sunset background">
      <div class="auth-left-content">
        <h1 class="auth-left-title" id="auth-left-title">Your next home is waiting for you</h1>
        <p class="auth-left-text" id="auth-left-text">
          Log in to continue browsing, save your favourites, and connect with verified landlords. All in one place.
        </p>
      </div>
    </section>

    <!-- RIGHT PANEL: Login form -->
    <section class="auth-right" aria-label="Sign in form panel">
      <div class="auth-form-container">
        
        <!-- Back Arrow -->
        <a href="../../index.html" class="auth-back-btn" aria-label="Go back to homepage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>

        <h2 class="auth-heading">Welcome back</h2>

        <form id="login-form" novalidate>
          
          <!-- Email Field Group -->
          <div class="form-group" id="email-group">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="e.g. amaka@example.com"
              autocomplete="username"
              required
              aria-describedby="email-error"
            />
            <div id="email-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Password Field Group -->
          <div class="form-group" id="password-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                id="password-toggle"
                class="password-toggle-btn"
                aria-label="Toggle password visibility"
              >
                <!-- Slashed eye (default state) -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <div id="password-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Remember Me & Forgot Password Options -->
          <div class="form-options">
            <label class="checkbox-label" for="remember-me">
              <input
                type="checkbox"
                id="remember-me"
                name="remember"
                class="checkbox-input"
              />
              Remember Me
            </label>
            <a href="forgot-password.html" class="forgot-password-link">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn--primary btn--full">Log In</button>

        </form>

        <p class="auth-footer">
          Don't have an account?
          <span class="auth-footer-signup">
            Sign Up as
            <a href="signup-student.html" class="auth-footer-link">Student</a>
            <span class="auth-footer-or">or</span>
            <a href="signup-landlord.html" class="auth-footer-link">Landlord</a>
          </span>
        </p>

      </div>
    </section>

  </main>

  <!-- Central script resources loaded in team-mandated order -->
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>

</body>
</html>
