<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your HostelHub account has been verified successfully." />
  <title>Verification Successful — HostelHub</title>

  <!-- Shared stylesheets -->
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />

  <!-- Page-specific styling -->
  <link rel="stylesheet" href="../../css/auth.css" />
</head>
<body>

  <main class="auth-page">
    
    <!-- LEFT PANEL: Brand Image and Overlaid Marketing Banner -->
    <section class="auth-left" aria-label="Hostel sunset background">
      <div class="auth-left-content">
        <h1 class="auth-left-title">Your account is live. Let the search begin</h1>
        <p class="auth-left-text">
          Welcome to HostelHub. Browse listings, message landlords, and save your favourites. All fully unlocked.
        </p>
      </div>
    </section>

    <!-- RIGHT PANEL: Success screen -->
    <section class="auth-right" aria-label="Registration success panel">
      <div class="auth-form-container" style="text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        
        <!-- 3D Success Badge -->
        <div style="margin-bottom: var(--space-xl); text-align: center;">
          <img src="../../assets/images/verified_badge.png" alt="Verification Successful" style="width: 140px; height: 140px; display: block; margin: 0 auto; filter: drop-shadow(0px 8px 16px rgba(22, 163, 74, 0.15));" />
        </div>

        <h2 class="auth-heading" style="margin-bottom: var(--space-xs); font-size: 2rem; width: 100%; text-align: center;">Verification successful</h2>
        
        <p style="font-size: var(--font-size-base); font-weight: 500; color: var(--color-text-muted); margin-bottom: var(--space-md); text-align: center; width: 100%;">
          Welcome to HostelHub
        </p>
        
        <p style="font-size: var(--font-size-base); color: var(--color-text-muted); line-height: 1.6; margin-bottom: var(--space-2xl); max-width: 320px; text-align: center;">
          You can now browse listings, save hostels, and contact verified landlords directly
        </p>

        <a href="login.html" class="btn btn--primary btn--full" style="text-align: center;">Back to Login</a>

      </div>
    </section>

  </main>

  <!-- Central script resources loaded in team-mandated order -->
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/components.js"></script>

</body>
</html>
