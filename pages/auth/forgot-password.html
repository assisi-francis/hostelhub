<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your HostelHub password. Enter your email and we'll send you a link to reset your password." />
  <title>Reset your password — HostelHub</title>

  <!-- Shared stylesheets -->
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/components.css" />

  <!-- Page-specific styling -->
  <link rel="stylesheet" href="../../css/auth.css" />
</head>
<body>

  <main class="auth-page">
    
    <!-- LEFT PANEL: Brand Image and Overlaid Marketing Banner -->
    <section class="auth-left" aria-label="Hostel sunset background">
      <div class="auth-left-content">
        <h1 class="auth-left-title">Forgot your password? It happens to everyone</h1>
        <p class="auth-left-text">
          Enter your email or phone number and we'll send a reset link within seconds. Your data is always safe with us.
        </p>
      </div>
    </section>

    <!-- RIGHT PANEL: Forgot password form -->
    <section class="auth-right" aria-label="Reset password form panel">
      <div class="auth-form-container">
        
        <!-- Back Arrow -->
        <a href="login.html" class="auth-back-btn" aria-label="Go back to login page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>

        <h2 class="auth-heading" style="margin-bottom: var(--space-xs);">Reset your password</h2>
        <p style="font-size: var(--font-size-base); color: var(--color-text-muted); margin-bottom: var(--space-xl);">
          Enter the email linked to your account.
        </p>

        <form id="forgot-form" novalidate>
          
          <!-- Email Field Group -->
          <div class="form-group" id="email-group">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="e.g. amaka@example.com"
              autocomplete="email"
              required
              aria-describedby="email-error"
            />
            <div id="email-error" class="form-error" aria-live="polite"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn--primary btn--full" style="margin-top: var(--space-md);">Send Reset Link</button>

        </form>

      </div>
    </section>

  </main>

  <!-- Central script resources loaded in team-mandated order -->
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/components.js"></script>

</body>
</html>
